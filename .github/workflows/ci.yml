# 푸시와 PR 마다 짝 검사 → 타입 검사 → 서버 테스트 → 웹 흐름 테스트.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞선 실행(e2e 포함 최대 30분)을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PC 앱(desktop)의 Electron 실행 파일은 CI 에서 쓰지 않는다.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성
        run: npm ci

      - name: 짝 검사 (문서·버전·공개 금지 패턴)
        run: npm run check:sync

      - name: 타입 검사
        run: npm run typecheck

      - name: 서버 테스트
        run: npm test

      - name: 브라우저 (Chromium)
        run: npx playwright-core install --with-deps chromium

      - name: 웹 흐름 테스트
        run: npm run test:e2e

      - name: 실패한 화면
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/.cache/failures/
          if-no-files-found: ignore
