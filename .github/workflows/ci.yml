# 푸시와 PR 마다 타입 검사 → 서버 테스트 → 웹 흐름 테스트.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 서버 테스트
        run: npm test

      - name: 브라우저 (Chromium)
        run: npx playwright-core install --with-deps chromium

      - name: 웹 흐름 테스트
        run: npm run test:e2e

      - name: 실패한 화면
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/.cache/failures/
          if-no-files-found: ignore
